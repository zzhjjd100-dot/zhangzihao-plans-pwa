<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#17191d">
    <meta name="color-scheme" content="dark">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="小计划">
    <meta name="format-detection" content="telephone=no">
    <title>张梓濠的小计划</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="apple-touch-icon" href="./icons/icon-180.png">
    <link rel="icon" href="./icons/icon-192.png" type="image/png">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <svg class="icon-sprite" aria-hidden="true">
      <symbol id="icon-mic" viewBox="0 0 24 24">
        <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
        <line x1="12" x2="12" y1="19" y2="22"></line>
      </symbol>
      <symbol id="icon-stop" viewBox="0 0 24 24">
        <rect width="14" height="14" x="5" y="5" rx="2"></rect>
      </symbol>
      <symbol id="icon-sparkles" viewBox="0 0 24 24">
        <path d="m12 3-1.9 5.1L5 10l5.1 1.9L12 17l1.9-5.1L19 10l-5.1-1.9Z"></path>
        <path d="M5 3v4M3 5h4M19 17v4M17 19h4"></path>
      </symbol>
      <symbol id="icon-plus" viewBox="0 0 24 24">
        <path d="M5 12h14M12 5v14"></path>
      </symbol>
      <symbol id="icon-calendar" viewBox="0 0 24 24">
        <rect width="18" height="18" x="3" y="4" rx="2"></rect>
        <path d="M16 2v4M8 2v4M3 10h18"></path>
      </symbol>
      <symbol id="icon-flag" viewBox="0 0 24 24">
        <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1Z"></path>
        <path d="M4 22v-7"></path>
      </symbol>
      <symbol id="icon-trash" viewBox="0 0 24 24">
        <path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v5M14 11v5"></path>
      </symbol>
      <symbol id="icon-check-circle" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9"></circle>
        <path d="m8.5 12.5 2.2 2.2 4.8-5"></path>
      </symbol>
      <symbol id="icon-circle" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9"></circle>
      </symbol>
      <symbol id="icon-chevron-right" viewBox="0 0 24 24">
        <path d="m9 18 6-6-6-6"></path>
      </symbol>
      <symbol id="icon-chevron-left" viewBox="0 0 24 24">
        <path d="m15 18-6-6 6-6"></path>
      </symbol>
      <symbol id="icon-x" viewBox="0 0 24 24">
        <path d="M18 6 6 18M6 6l12 12"></path>
      </symbol>
      <symbol id="icon-arrow-up" viewBox="0 0 24 24">
        <path d="m18 15-6-6-6 6"></path>
      </symbol>
      <symbol id="icon-download" viewBox="0 0 24 24">
        <path d="M12 3v12M7 10l5 5 5-5M5 21h14"></path>
      </symbol>
      <symbol id="icon-clock" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9"></circle>
        <path d="M12 7v5l3 2"></path>
      </symbol>
      <symbol id="icon-edit" viewBox="0 0 24 24">
        <path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"></path>
      </symbol>
      <symbol id="icon-more" viewBox="0 0 24 24">
        <circle cx="5" cy="12" r="1"></circle>
        <circle cx="12" cy="12" r="1"></circle>
        <circle cx="19" cy="12" r="1"></circle>
      </symbol>
    </svg>

    <div class="app-shell">
      <header class="app-header" id="appHeader"></header>
      <main class="app-content" id="appContent" tabindex="-1"></main>

      <section class="composer" aria-label="添加计划">
        <div class="composer-input-row">
          <label class="sr-only" for="draftInput">输入计划</label>
          <textarea
            id="draftInput"
            class="composer-input"
            rows="1"
            enterkeyhint="done"
            placeholder="说一句或写一句计划…"
            autocomplete="off"
          ></textarea>
          <button class="mic-button" id="micButton" type="button" aria-label="语音输入">
            <svg class="icon"><use href="#icon-mic"></use></svg>
          </button>
        </div>

        <div class="composer-mode-row">
          <div class="segmented" role="group" aria-label="加入方式">
            <button class="segment is-active" type="button" data-mode="smart">智能整理</button>
            <button class="segment" type="button" data-mode="raw">原样加入</button>
          </div>
          <span class="recording-indicator" id="recordingIndicator" hidden>
            <i></i><i></i><i></i>
          </span>
        </div>

        <div class="composer-action-row">
          <label class="compact-control date-control">
            <svg class="icon"><use href="#icon-calendar"></use></svg>
            <input id="dateInput" type="date" aria-label="计划日期">
          </label>
          <label class="compact-control importance-control" data-importance="medium">
            <svg class="icon"><use href="#icon-flag"></use></svg>
            <select id="importanceInput" aria-label="重要性">
              <option value="high">高重要</option>
              <option value="medium" selected>中重要</option>
              <option value="low">低重要</option>
            </select>
          </label>
          <button class="save-button" id="saveButton" type="button" disabled>
            <svg class="icon"><use href="#icon-sparkles"></use></svg>
            <span>整理并加入</span>
          </button>
        </div>
      </section>
    </div>

    <section class="modal-layer" id="reviewModal" hidden>
      <div class="modal-card review-modal" role="dialog" aria-modal="true" aria-labelledby="reviewTitle">
        <header class="modal-header">
          <div>
            <h2 id="reviewTitle">确认整理结果</h2>
            <p id="reviewSummary"></p>
          </div>
          <button class="icon-button" type="button" data-close-review aria-label="关闭">
            <svg class="icon"><use href="#icon-x"></use></svg>
          </button>
        </header>
        <div class="review-list" id="reviewList"></div>
        <div class="keyword-wrap" id="keywordWrap" hidden></div>
        <details class="source-details">
          <summary>查看原始内容</summary>
          <p id="originalTranscript"></p>
        </details>
        <footer class="modal-footer">
          <button class="secondary-button" type="button" data-close-review>取消</button>
          <button class="primary-button" type="button" id="confirmReview">全部加入</button>
        </footer>
      </div>
    </section>

    <section class="modal-layer" id="actionModal" hidden>
      <div class="modal-card action-modal" role="dialog" aria-modal="true" aria-labelledby="actionTitle">
        <h2 id="actionTitle"></h2>
        <p id="actionMessage"></p>
        <div class="action-buttons" id="actionButtons"></div>
      </div>
    </section>

    <section class="modal-layer" id="installModal" hidden>
      <div class="modal-card action-modal" role="dialog" aria-modal="true" aria-labelledby="installTitle">
        <h2 id="installTitle">添加到主屏幕</h2>
        <p>在 Safari 中点“分享”，再选择“添加到主屏幕”。</p>
        <div class="action-buttons">
          <button class="primary-button" type="button" data-close-install>知道了</button>
        </div>
      </div>
    </section>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
